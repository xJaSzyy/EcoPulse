name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x   

      - name: Restore
        run: dotnet restore

      - name: Check formatting (dotnet-format)
        run: |
          dotnet tool install -g dotnet-format --ignore-failed-sources
          dotnet-format --formatting --check --verbosity normal

      - name: Test
        run: |
          cd EcoPulseBackendTests
          dotnet test --configuration Release --verbosity normal